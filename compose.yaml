name: humanize-ai-studio

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: humanize-ai-studio-api:local
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      HUMANIZE_REWRITE_PROVIDER: ${HUMANIZE_REWRITE_PROVIDER:-deterministic}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/openai/gpt-oss-20b}
      CLOUDFLARE_AI_TIMEOUT_SECONDS: ${CLOUDFLARE_AI_TIMEOUT_SECONDS:-30}
      CLOUDFLARE_AI_FALLBACK_ENABLED: ${CLOUDFLARE_AI_FALLBACK_ENABLED:-true}
    expose:
      - "8000"
    networks:
      - application
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: humanize-ai-studio-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - application
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

networks:
  application:
    name: humanize-ai-studio-network
    driver: bridge
